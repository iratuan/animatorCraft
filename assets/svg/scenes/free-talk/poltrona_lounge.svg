<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- Encosto acolchoado da poltrona -->
  <path d="M 40,20 Q 100,10 160,20 L 170,120 Q 100,130 30,120 Z" fill="#ffffff" stroke="#14161a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Costuras verticais decorativas do encosto -->
  <line x1="75" y1="20" x2="75" y2="120" stroke="#14161a" stroke-width="1.8" stroke-dasharray="6 3"/>
  <line x1="100" y1="18" x2="100" y2="122" stroke="#14161a" stroke-width="1.8" stroke-dasharray="6 3"/>
  <line x1="125" y1="20" x2="125" y2="120" stroke="#14161a" stroke-width="1.8" stroke-dasharray="6 3"/>
  <!-- Assento fofo -->
  <rect x="25" y="115" width="150" height="40" rx="12" fill="#ffffff" stroke="#14161a" stroke-width="3.5"/>
  <!-- Braço esquerdo da poltrona -->
  <path d="M 20,95 Q 15,140 25,145" fill="none" stroke="#14161a" stroke-width="5" stroke-linecap="round"/>
  <!-- Braço direito da poltrona -->
  <path d="M 180,95 Q 185,140 175,145" fill="none" stroke="#14161a" stroke-width="5" stroke-linecap="round"/>
  <!-- Pés palito de madeira inclinados -->
  <line x1="45" y1="155" x2="30" y2="225" stroke="#14161a" stroke-width="5" stroke-linecap="round"/>
  <line x1="155" y1="155" x2="170" y2="225" stroke="#14161a" stroke-width="5" stroke-linecap="round"/>
  <!-- Pés traseiros -->
  <line x1="60" y1="150" x2="50" y2="205" stroke="#14161a" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="150" x2="150" y2="205" stroke="#14161a" stroke-width="3" stroke-linecap="round"/>
</svg>
